name: Compare upstream WebRPG index

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Index GitHub RPG Maker repositories
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: compare-upstream-webrpg-index
  cancel-in-progress: false

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Compare catalogs
        run: node scripts/compare-upstream-list.mjs
      - name: Publish comparison report atomically
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GENERATED_PATH: reports/upstream-list-comparison.json
          TARGET_PATH: reports/upstream-list-comparison.json
          MERGE_MODE: replace
          COMMIT_MESSAGE: "chore: compare upstream WebRPG index"
        run: node scripts/publish-generated-file.mjs
