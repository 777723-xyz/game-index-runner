name: Index GitHub RPG Maker repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: index-github-rpgmaker-repos
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Create index repository token
        id: index-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WEBRPG_APP_CLIENT_ID }}
          private-key: ${{ secrets.WEBRPG_APP_PRIVATE_KEY }}
          owner: 777723-xyz

      - name: Check out index
        uses: actions/checkout@v5
        with:
          token: ${{ steps.index-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Capture catalog baseline
        run: cp list.json "$RUNNER_TEMP/list-base.json"

      - name: Sync upstream WebRPG catalog
        run: node scripts/sync-upstream-list.mjs

      - name: Search GitHub code
        env:
          WEBRPG_SEARCH_TOKEN: ${{ steps.index-token.outputs.token }}
          SEARCH_MAX_PAGES: "10"
          SEARCH_PER_PAGE: "100"
          SEARCH_DELAY_SECONDS: "8"
        run: node scripts/index-github-rpgmaker-repos.mjs

      - name: Publish index updates atomically
        env:
          GITHUB_TOKEN: ${{ steps.index-token.outputs.token }}
          BASE_PATH: ${{ runner.temp }}/list-base.json
          GENERATED_PATH: list.json
          TARGET_PATH: list.json
          MERGE_MODE: catalog
          COMMIT_MESSAGE: Index GitHub RPG Maker repositories
        run: node scripts/publish-generated-file.mjs
